# Fully-local development profile: no OpenAI embeddings, no Cohere, no Redis.
# Only the LLM still needs a network call.
#
#   CONFIG_FILE=config.local.yaml docker compose up
#   # or, outside Docker:
#   cp config.local.yaml config.yaml
#
# Requires the local model extras:
#   pip install -r requirements.txt -r requirements-local.txt
app_env: local
log_level: DEBUG
log_format: text

embedding_provider: sentence-transformers
local_embedding_model: sentence-transformers/all-MiniLM-L6-v2

llm_provider: groq
groq_model: openai/gpt-oss-120b
llm_max_tokens: 1024

chroma_mode: persistent
chroma_persist_dir: ./chroma_db
# Separate collection name so local 384-d vectors never collide with the
# 1536-d production collection.
chroma_collection: documents_local

reranker: cross-encoder

cache_backend: memory
query_cache_ttl_seconds: 300

cors_allow_origins: "http://localhost:3000,http://localhost:5173"
